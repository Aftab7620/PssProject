<template>
    <lightning-card title="Cinema Permit Tracker">

        <!-- HEADER -->
        <div class="header slds-p-around_medium">
            <div>
                <h2 class="permit-title">{permit.Name}</h2>
            </div>

            <!-- STATUS + BUTTON RIGHT SIDE -->
            <div class="header-right">
                <!--<lightning-badge label={permit.Application_Status__c}></lightning-badge>-->

                <!-- Grievance button (TOP RIGHT) -->
                <template if:true={isRejected}>
                    <lightning-button 
                        label="Register Grievance"
                        variant="destructive"
                        onclick={openModal}
                        class="grievance-top-btn">
                    </lightning-button>
                </template>
            </div>
        </div>

        <!-- PROGRESS TRACKER -->
        <div class="tracker">
            <template for:each={steps} for:item="step" for:index="index">
                <div key={step.value} class="tracker-step">

                    <!-- ICON -->
                    <div class={step.iconClass}>
                        <lightning-icon 
                            icon-name={step.icon} 
                            size="small">
                        </lightning-icon>
                    </div>

                    <!-- LINE -->
                    <div if:false={step.isLast} class={step.lineClass}></div>

                    <!-- LABEL -->
                    <div class="tracker-label">
                        {step.value}
                    </div>
                </div>
            </template>
        </div>

        <!-- INFO GRID -->
        <div class="info-modern">

            <div class="info-item">
                <lightning-icon icon-name="standard:document" size="small"></lightning-icon>
                <div>
                    <p class="label">Permit Type</p>
                    <p class="value">{permit.Permit_Type__c}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="standard:category" size="small"></lightning-icon>
                <div>
                    <p class="label">Category</p>
                    <p class="value">{permit.Application_Category__c}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                <div>
                    <p class="label">Cinema</p>
                    <p class="value">{cinemaName}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                <div>
                    <p class="label">Applicant</p>
                    <p class="value">{applicantName}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="utility:email" size="small"></lightning-icon>
                <div>
                    <p class="label">Email</p>
                    <p class="value">{applicantEmail}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="utility:call" size="small"></lightning-icon>
                <div>
                    <p class="label">Phone</p>
                    <p class="value">{applicantPhone}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <div>
                    <p class="label">Status</p>
                    <p class="value">{permit.Application_Status__c}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="utility:event" size="small"></lightning-icon>
                <div>
                    <p class="label">Submission Date</p>
                    <p class="value">{permit.Submission_Date__c}</p>
                </div>
            </div>

            <div class="info-item">
                <lightning-icon icon-name="utility:currency" size="small"></lightning-icon>
                <div>
                    <p class="label">Fee</p>
                    <p class="value">₹{permit.Fee_Amount__c}</p>
                </div>
            </div>

        </div>

        <!-- 🔥 GRIEVANCE MODAL -->
<template if:true={showModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <!-- HEADER -->
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Register Grievance</h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium">

                <lightning-input 
    label="Subject"
    value={grievance.Subject__c}
    data-field="Subject__c"
    onchange={handleChange}>
</lightning-input>

<lightning-textarea 
    label="Description"
    value={grievance.Description__c}
    data-field="Description__c"
    onchange={handleChange}>
</lightning-textarea>
            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">
                <lightning-button 
                    label="Cancel" 
                    onclick={closeModal}>
                </lightning-button>

                <lightning-button 
                    variant="brand" 
                    label="Submit"
                    onclick={submitGrievance}>
                </lightning-button>
            </footer>

        </div>
    </section>

    <!-- BACKDROP -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

    </lightning-card>
</template>
